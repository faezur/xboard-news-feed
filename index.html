<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crio News Feed</title>
    <meta name="description" content="Crio Feed Website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="resources/css/index.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white">
        <div class="container">
            <a class="navbar-brand" href="#">
                Crio News Feed
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container news-page">

        <header class="page-heading">
            <h1>Today</h1>
            <p>The insights you need to keep ahead</p>
        </header>

        <!-- News Accordion -->
        <div class="accordion news-accordion" id="newsAccordion">

            <!-- Politics -->
            <section class="accordion-item">

                <h2 class="accordion-header" id="politics-heading">

                    <button
                        class="accordion-button"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#politics"
                        aria-expanded="true"
                        aria-controls="politics">

                        Politics

                    </button>

                </h2>

                <div
                    id="politics"
                    class="accordion-collapse collapse show"
                    aria-labelledby="politics-heading">

                    <div class="accordion-body">

                        <div id="politics-content">
                            Loading news...
                        </div>

                    </div>

                </div>

            </section>

            <!-- Sports -->
            <section class="accordion-item">

                <h2 class="accordion-header" id="sports-heading">

                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#sports"
                        aria-expanded="false"
                        aria-controls="sports">

                        Sports

                    </button>

                </h2>

                <div
                    id="sports"
                    class="accordion-collapse collapse"
                    aria-labelledby="sports-heading">

                    <div class="accordion-body">

                        <div id="sports-content">
                            Loading news...
                        </div>

                    </div>

                </div>

            </section>

            <!-- Technology -->
            <section class="accordion-item">

                <h2 class="accordion-header" id="technology-heading">

                    <button
                        class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#technology"
                        aria-expanded="false"
                        aria-controls="technology">

                        Technology

                    </button>

                </h2>

                <div
                    id="technology"
                    class="accordion-collapse collapse"
                    aria-labelledby="technology-heading">

                    <div class="accordion-body">

                        <div id="technology-content">
                            Loading news...
                        </div>

                    </div>

                </div>

            </section>

        </div>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- RSS Feed Data -->
    <script src="resources/data/magazines.js"></script>

    <!-- Custom JavaScript -->
    <script src="resources/js/index.js"></script>

</body>
</html>
